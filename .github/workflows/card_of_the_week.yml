name: Card of the Week

on:
  schedule:
    # Everything posts at 10:00 AM US Central, all year. GitHub crons are UTC-only and ignore
    # daylight saving, so each post is scheduled at BOTH possible UTC times and the `gate` job
    # below lets through only the one that matches the current Central offset:
    #   15:00 UTC = 10 AM CDT (summer)     16:00 UTC = 10 AM CST (winter)
    # Card of the Week - Mondays
    - cron: "0 15 * * 1"
    - cron: "0 16 * * 1"
    # P1P1 - Wednesdays
    - cron: "0 15 * * 3"
    - cron: "0 16 * * 3"
    # Trophy Battle - Fridays
    - cron: "0 15 * * 5"
    - cron: "0 16 * * 5"

  # Allows manual triggering from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run manually'
        required: true
        default: 'card-of-the-week'
        type: choice
        options:
          - card-of-the-week
          - p1p1
          - trophy-battle
          - scrape-trophies
          - preview-deck-image
          - push-clash-only
          - probe-winrate
          - clear-channel
      drafter:
        description: 'Drafter name for preview-deck-image (blank = random deck without a photo), or card name for probe-winrate (blank = Uro)'
        required: false
        default: ''
        type: string
      confirm:
        description: 'clear-channel only: leave blank to just COUNT what would be deleted; type DELETE (capitals) to really delete'
        required: false
        default: ''
        type: string
      delete_after:
        description: 'clear-channel only, optional: only delete messages sent ON or AFTER this date (YYYY-MM-DD, US Central). Older messages are kept'
        required: false
        default: ''
        type: string
      delete_before:
        description: 'clear-channel only, optional: only delete messages sent BEFORE this date (YYYY-MM-DD, US Central). Newer messages are kept'
        required: false
        default: ''
        type: string

jobs:
  # Decides whether a scheduled run is the right one of the two daily triggers.
  # Manual (workflow_dispatch) runs always pass.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - name: Is this the 10 AM Central trigger?
        id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "Manual run: go."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OFFSET=$(TZ=America/Chicago date -d "${NOW:-now}" +%z)   # -0500 = CDT, -0600 = CST
          TRIGGER_HOUR=$(echo "$SCHEDULE" | awk '{print $2}')       # 15 or 16 (UTC)
          if [ "$OFFSET" = "-0500" ]; then WANT=15; else WANT=16; fi
          echo "Central offset $OFFSET -> the $WANT:00 UTC trigger is the 10 AM one; this is the $TRIGGER_HOUR:00 UTC trigger."
          if [ "$TRIGGER_HOUR" = "$WANT" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "Skipping: wrong trigger for the current daylight-saving offset."; echo "go=false" >> "$GITHUB_OUTPUT"; fi

  card-of-the-week:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.go == 'true' && ((github.event_name == 'schedule' && (github.event.schedule == '0 15 * * 1' || github.event.schedule == '0 16 * * 1')) || (github.event_name == 'workflow_dispatch' && inputs.job == 'card-of-the-week'))

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run card of the week script
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python card_of_the_week.py

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || git commit -m "Update card history"
          git push

  p1p1:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.go == 'true' && ((github.event_name == 'schedule' && (github.event.schedule == '0 15 * * 3' || github.event.schedule == '0 16 * * 3')) || (github.event_name == 'workflow_dispatch' && inputs.job == 'p1p1'))

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run P1P1 script
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          CUBECOBRA_SESSION: ${{ secrets.CUBECOBRA_SESSION }}
        run: python p1p1_bot.py

  trophy-battle:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.go == 'true' && ((github.event_name == 'schedule' && (github.event.schedule == '0 15 * * 5' || github.event.schedule == '0 16 * * 5')) || (github.event_name == 'workflow_dispatch' && inputs.job == 'trophy-battle'))

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pillow

      # Pull any new trophy winners from Cube Cobra first so they're eligible this week.
      # Failure here shouldn't block the battle itself.
      - name: Scrape new trophy decks
        continue-on-error: true
        run: python scrape_trophies.py

      - name: Run trophy battle script
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          CLASH_URL: ${{ secrets.CLASH_URL }}
          CLASH_SECRET: ${{ secrets.CLASH_SECRET }}
        run: python trophy_battle.py

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trophy_battle_history.json trophy_decks.json current_week.json
          git diff --staged --quiet || git commit -m "Update trophy battle history, trophy decks, and current week"
          git push

  scrape-trophies:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'scrape-trophies'

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run trophy scraper
        run: python scrape_trophies.py

      - name: Commit updated trophy decks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trophy_decks.json
          git diff --staged --quiet || git commit -m "Update trophy decks"
          git push

  # Test helper: posts a generated deck grid image to Discord and nothing else.
  preview-deck-image:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'preview-deck-image'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pillow

      - name: Generate and post preview image
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python trophy_battle.py --preview-image "${{ inputs.drafter }}"

  # Test helper: pushes a random matchup to Cube Clash and commits current_week.json.
  # No Discord post, no history entry.
  push-clash-only:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'push-clash-only'

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pillow

      - name: Push test matchup to Cube Clash
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          CLASH_URL: ${{ secrets.CLASH_URL }}
          CLASH_SECRET: ${{ secrets.CLASH_SECRET }}
        run: python trophy_battle.py --clash-only

      - name: Commit current week
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add current_week.json
          git diff --staged --quiet || git commit -m "Update current week (test push)"
          git push

  # Diagnostic: computes win rates from Cube Cobra's records and prints one card's numbers.
  # Posts nothing to Discord and changes nothing in the repo.
  probe-winrate:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'probe-winrate'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Compute winrates and print one card
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python card_of_the_week.py --probe-winrate "${{ inputs.drafter }}"

  # Deletes every non-pinned message in the Discord channel (the channel itself is kept).
  # Without confirm = DELETE it only counts what it would delete.
  clear-channel:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'clear-channel'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Clear channel
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          CONFIRM: ${{ inputs.confirm }}
          DELETE_AFTER: ${{ inputs.delete_after }}
          DELETE_BEFORE: ${{ inputs.delete_before }}
          # Safety: abort unless DISCORD_CHANNEL_ID points at this exact channel name.
          EXPECTED_CHANNEL: weekly-packs-cards-decks
        run: python clear_channel.py
